backend:
  name: github
  repo: richartl/personal-blog
  branch: main

# Modo local: al correr `pnpm cms` (astro dev + decap-server) la CMS detecta
# que está en localhost y escribe los archivos directamente en el repo local,
# sin pedir login ni tocar GitHub. Ver README para más detalle.
local_backend: true

media_folder: "public/uploads"
public_folder: "/personal-blog/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/data/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    identifier_field: "title"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Autor", name: "author", widget: "string", default: "Ricardo Pérez" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Fecha de publicación", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Páginas"
    folder: "src/data/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    identifier_field: "title"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Kicker", name: "kicker", widget: "string", default: "Info" }
      - label: "Color del kicker"
        name: "kickerColor"
        widget: "select"
        default: "tape-surf"
        options: ["tape-surf", "tape-tape", "tape-flare", "tape-ink", "tape-paper"]
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Proyectos"
    folder: "src/data/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    identifier_field: "title"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Kicker", name: "kicker", widget: "string" }
      - label: "Color del kicker"
        name: "kickerColor"
        widget: "select"
        default: "tape-surf"
        options: ["tape-surf", "tape-tape", "tape-flare", "tape-ink", "tape-paper"]
      - { label: "Orden", name: "order", widget: "number", default: 0, value_type: "int" }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }
