services:
  blog:
    image: node:24-alpine
    container_name: ricardo-blog
    working_dir: /app
    ports:
      - "4321:4321"
      - "8081:8081"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    environment:
      PNPM_HOME: /pnpm
      PATH: /pnpm:$PATH
      CI: "true"
    command: >
      sh -c "
      corepack enable &&
      pnpm install &&
      pnpm exec concurrently -n astro,cms 'pnpm exec astro dev --host 0.0.0.0' 'pnpm exec decap-server'
      "

  # Servicio aparte para probar TinaCMS, corre al mismo tiempo que `blog` (Decap):
  # usa el puerto 4323 para Astro y 4001 para el GraphQL de Tina, así no chocan.
  blog-tina:
    image: node:24-alpine
    container_name: ricardo-blog-tina
    working_dir: /app
    ports:
      - "4323:4323"
      - "4001:4001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    environment:
      PNPM_HOME: /pnpm
      PATH: /pnpm:$PATH
      CI: "true"
    command: >
      sh -c "
      corepack enable &&
      pnpm install &&
      pnpm exec tinacms dev -c 'astro dev --host 0.0.0.0 --port 4323'
      "

volumes:
  node_modules:
  pnpm_store:
